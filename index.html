<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Friend v3</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- 🌿 頁面容器 -->
    <div id="app">

        <!-- 🌿📱 首頁：多植物卡片輪播 -->
        <section id="homePage" class="page active">

            <h2 class="page-title">我的植物</h2>

            <div class="carousel-container">
                <div class="carousel" id="plantCarousel">

                    <!-- 1️⃣ 白鶴芋 Peace Lily -->
                    <div class="plant-card" data-id="0">
                        <img src="https://i.imgur.com/vj6Yw0N.jpeg" class="plant-photo" />
                        <div class="plant-info">
                            <h3>白鶴芋 Peace Lily</h3>

                            <div class="stats">
                                <div class="stat-row">
                                    <span>健康度</span>
                                    <div class="bar"><div class="bar-fill health"></div></div>
                                    <span class="value health-val">92%</span>
                                </div>

                                <div class="stat-row">
                                    <span>濕度</span>
                                    <div class="bar"><div class="bar-fill moisture"></div></div>
                                    <span class="value moisture-val">45%</span>
                                </div>

                                <div class="stat-row">
                                    <span>光照</span>
                                    <div class="bar"><div class="bar-fill light"></div></div>
                                    <span class="value light-val">60%</span>
                                </div>

                                <div class="stat-row">
                                    <span>溫度</span>
                                    <div class="bar"><div class="bar-fill temp"></div></div>
                                    <span class="value temp-val">23°C</span>
                                </div>

                                <div class="today-row">
                                    <span>今日澆水：<b class="water-today">✔</b></span>
                                    <span>心情：<b class="mood-today">🙂</b></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2️⃣ 流蘇蕨 Asparagus Fern -->
                    <div class="plant-card" data-id="1">
                        <img src="https://i.imgur.com/cXjUzGw.jpeg" class="plant-photo" />
                        <div class="plant-info">
                            <h3>流蘇蕨 Asparagus Fern</h3>

                            <div class="stats">
                                <div class="stat-row">
                                    <span>健康度</span>
                                    <div class="bar"><div class="bar-fill health"></div></div>
                                    <span class="value health-val">87%</span>
                                </div>

                                <div class="stat-row">
                                    <span>濕度</span>
                                    <div class="bar"><div class="bar-fill moisture"></div></div>
                                    <span class="value moisture-val">52%</span>
                                </div>

                                <div class="stat-row">
                                    <span>光照</span>
                                    <div class="bar"><div class="bar-fill light"></div></div>
                                    <span class="value light-val">40%</span>
                                </div>

                                <div class="stat-row">
                                    <span>溫度</span>
                                    <div class="bar"><div class="bar-fill temp"></div></div>
                                    <span class="value temp-val">21°C</span>
                                </div>

                                <div class="today-row">
                                    <span>今日澆水：<b class="water-today">🌵</b></span>
                                    <span>心情：<b class="mood-today">😐</b></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3️⃣ 吊蘭 Spider Plant -->
                    <div class="plant-card" data-id="2">
                        <img src="https://i.imgur.com/U7VxO8O.jpeg" class="plant-photo" />
                        <div class="plant-info">
                            <h3>吊蘭 Spider Plant</h3>

                            <div class="stats">
                                <div class="stat-row">
                                    <span>健康度</span>
                                    <div class="bar"><div class="bar-fill health"></div></div>
                                    <span class="value health-val">95%</span>
                                </div>

                                <div class="stat-row">
                                    <span>濕度</span>
                                    <div class="bar"><div class="bar-fill moisture"></div></div>
                                    <span class="value moisture-val">48%</span>
                                </div>

                                <div class="stat-row">
                                    <span>光照</span>
                                    <div class="bar"><div class="bar-fill light"></div></div>
                                    <span class="value light-val">70%</span>
                                </div>

                                <div class="stat-row">
                                    <span>溫度</span>
                                    <div class="bar"><div class="bar-fill temp"></div></div>
                                    <span class="value temp-val">24°C</span>
                                </div>

                                <div class="today-row">
                                    <span>今日澆水：<b class="water-today">✔</b></span>
                                    <span>心情：<b class="mood-today">🙂</b></span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </section>

        <!-- 🌿🌡 植物詳細頁 -->
        <section id="detailPage" class="page">
            <button class="back-btn" onclick="goToPage('homePage')">← 返回</button>
            <img id="detailPhoto" class="detail-photo" />
            <h2 id="detailName"></h2>

            <div id="detailStats"></div>

            <div class="detail-actions">
                <button onclick="goToPage('analysisPage')">AI 分析</button>
                <button onclick="goToPage('diaryPage')">日記</button>
            </div>
        </section>

        <!-- 🌿📅 日記頁 -->
        <section id="diaryPage" class="page">
            <button class="back-btn" onclick="goToPage('detailPage')">← 返回</button>

            <h2>植物日記</h2>

            <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <!-- 🌿🤖 AI 分析頁 -->
        <section id="analysisPage" class="page">
            <button class="back-btn" onclick="goToPage('detailPage')">← 返回</button>

            <h2>AI 分析中心</h2>

            <img id="analysisPhoto" class="analysis-photo" />

            <div id="analysisResult" class="analysis-box">請選擇植物開始分析</div>

            <button onclick="runAI()">開始 AI 分析</button>
        </section>

    </div>

    <!-- 🌿 底部導航列 -->
    <nav class="bottom-nav">
        <button onclick="goToPage('homePage')">首頁</button>
        <button onclick="goToPage('detailPage')">詳細</button>
        <button onclick="goToPage('diaryPage')">日記</button>
        <button onclick="goToPage('analysisPage')">AI分析</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
